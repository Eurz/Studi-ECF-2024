vich_uploader:
    db_driver: orm

    metadata:
        type: attribute
    mappings:
        services:
            uri_prefix: /uploads/images/services
            upload_destination: '%kernel.project_dir%/public/uploads/images/services'
            namer: Vich\UploaderBundle\Naming\SmartUniqueNamer

            directory_namer:
                service: Vich\UploaderBundle\Naming\CurrentDateTimeDirectoryNamer
                options:
                    date_time_format: 'Y/d/m' # will create directory "2018/23/09" for current date "2018-09-23"
                    date_time_property: updatedAt # see above example

            inject_on_load: false
            delete_on_update: true
            delete_on_remove: true

        vehicle_photo:
            uri_prefix: /uploads/images/vehicles
            upload_destination: '%kernel.project_dir%/public/uploads/images/vehicles'
            namer: Vich\UploaderBundle\Naming\SmartUniqueNamer

            inject_on_load: false
            delete_on_update: true
            delete_on_remove: true
